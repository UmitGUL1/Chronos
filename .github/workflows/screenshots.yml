name: Capture actual desktop screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/screenshots.yml'
      - 'apps/desktop/**'
      - 'ui/qml/**'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure and build
        run: |
          cmake -S . -B build/screenshots -DCHRONOS_BUILD_DESKTOP=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/screenshots --parallel 2
      - name: Run tests
        run: ctest --test-dir build/screenshots --output-on-failure --timeout 90
      - name: Capture rendered application under Xvfb
        env:
          QT_QUICK_BACKEND: software
        run: xvfb-run -a -s '-screen 0 1600x1000x24' ./build/screenshots/chronos-desktop --screenshots screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: ChronOS-Desktop-Screenshots
          path: screenshots/*.png
          if-no-files-found: error
